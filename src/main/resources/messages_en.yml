language-name: English
value:
  language-auto: "Automatic"
  language-en: "English"
  language-tr: "Turkish"
  language-de: "German"
  language-es: "Spanish"
  language-ru: "Russian"
  "yes": "yes"
  "no": "no"
words:
  force: "force"
# Command names shown in clickable lists and hints. Use names or aliases from plugin.yml.
commands:
  home: "/home"
  warp: "/warp"
  spawn: "/spawn"
  back: "/back"
  phome: "/phome"
general:
  no-permission: "{prefix} &cYou do not have permission to do that."
  player-only: "{prefix} &cThis command can only be used in-game."
  unknown-command: "{prefix} &cUnknown command. Use &f/dyhomes help&c."
  invalid-language: "{prefix} &cAvailable languages: &fauto&7, &fen&7, &ftr&7, &fde&7, &fes&7, &fru&c."
  language-changed: "{prefix} &aYour language is now &f{language}&a."
  server-language-changed: "{prefix} &aServer language mode is now &f{language}&a."
  player-not-found: "{prefix} &cNo player named &f{player}&c is known."
  reload: "{prefix} &aSettings, messages, warps and spawn reloaded."
  reload-failed: "{prefix} &cReload failed. Previous settings are kept; check the console."
help:
  player:
    - "&8&m----------&r &6DyHomes &fHelp &8&m----------"
    - "&6/home [name] &7- Teleport to a home"
    - "&6/homes &7- List your homes"
    - "&6/sethome [name] &7- Set a home where you stand"
    - "&6/delhome <name> &7- Delete a home"
    - "&6/warp [name] &7- Teleport to a warp or list them"
    - "&6/spawn &7- Teleport to the spawn"
    - "&6/back &7- Return to where you last teleported from or died"
    - "&6/publichome <name> &7- Open a home to everyone, or close it"
    - "&6/phome <player:home> &7- Visit a public home"
    - "&6/phomes &7- List public homes"
    - "&6/dyhomes language <auto|en|tr|de|es|ru> &7- Change your language"
  admin:
    - "&8&m----------&r &6DyHomes &fAdmin &8&m----------"
    - "&6/setwarp <name> &7- Create or move a warp"
    - "&6/delwarp <name> &7- Delete a warp"
    - "&6/setspawn &7- Set the spawn where you stand"
    - "&6/homes <player> &7- List a player's homes"
    - "&6/home <player>:<name> &7- Visit a player's home"
    - "&6/delhome <player>:<name> &7- Delete a player's home"
    - "&6/dyhomes import <essentials|huskhomes> &7- Copy homes, warps and spawn from EssentialsX or HuskHomes"
    - "&6/dyhomes reload &7- Reload settings and messages"
list:
  names: "&7{names}"
  name: "&f{name}"
  name-public: "&a{name}"
  separator: "&7, "
  hover: "&7Click: &f{command}"
homes:
  none: "{prefix} &7You have no homes yet. Use &f/sethome &7to set one."
  none-other: "{prefix} &f{player} &7has no homes."
  not-found: "{prefix} &cNo home named &f{name}&c."
  list: "{prefix} &7Your homes &8({count}/{limit})&7:"
  list-other: "{prefix} &7Homes of &f{player} &8({count})&7:"
  invalid-name: "{prefix} &f{name} &cis not a valid name. Use letters, digits, '_' or '-', up to 32 characters."
  world-disabled: "{prefix} &cHomes cannot be set in this world."
  storage-locked: "{prefix} &cThese homes cannot be changed right now. An administrator has been told in the console."
  limit: "{prefix} &cYou have reached your home limit of &f{limit}&c. Delete one with &f/delhome&c or move an existing one."
  claim-denied: "{prefix} &cYou cannot set a home in this claim. Ask its owner to trust you."
  save-failed: "{prefix} &cThis could not be saved. Nothing was changed; check the console."
  set: "{prefix} &aHome &f{name} &aset &8({count}/{limit})&a."
  moved: "{prefix} &aHome &f{name} &amoved here."
  delete-usage: "{prefix} &cUse &f/delhome <name>&c."
  deleted: "{prefix} &aHome &f{name} &adeleted."
  unlimited: "unlimited"
warps:
  none: "{prefix} &7There are no warps yet."
  not-found: "{prefix} &cNo warp named &f{name}&c."
  list: "{prefix} &7Warps &8({count})&7:"
  set-usage: "{prefix} &cUse &f/setwarp <name>&c."
  set: "{prefix} &aWarp &f{name} &acreated."
  moved: "{prefix} &aWarp &f{name} &amoved here."
  delete-usage: "{prefix} &cUse &f/delwarp <name>&c."
  deleted: "{prefix} &aWarp &f{name} &adeleted."
spawn:
  not-set: "{prefix} &cNo spawn has been set."
  set: "{prefix} &aSpawn set in &f{world} &aat &f{x}, {y}, {z}&a."
teleport:
  world-missing: "{prefix} &cThe world of this destination is not loaded."
  cooldown: "{prefix} &cYou can use this again in &f{time}&c."
  not-enough-money: "{prefix} &cYou need &f{cost}&c for this."
  claim-denied: "{prefix} &cYou no longer have access to the claim where &f{name} &cis."
  claim-unavailable: "{prefix} &cClaim protection could not be checked. Try again later."
  failed: "{prefix} &cThe teleport failed. Please try again."
  unsafe-suffocation: "{prefix} &cThe destination is blocked; you would be stuck in a wall."
  unsafe-hazard: "{prefix} &cThe destination has lava, fire or another hazard."
  unsafe-fall: "{prefix} &cThere is no ground under the destination."
  unsafe-void: "{prefix} &cThe destination is outside the world's height."
  unsafe-hint: "{prefix} &7To go anyway, use &f{command}&7."
  warmup: "{prefix} &7Teleporting in &f{seconds}&7 seconds. Do not move."
  cancel-move: "{prefix} &cTeleport cancelled because you moved."
  cancel-damage: "{prefix} &cTeleport cancelled because you took damage."
  success-home: "{prefix} &aWelcome home to &f{name}&a."
  success-warp: "{prefix} &aTeleported to warp &f{name}&a."
  success-spawn: "{prefix} &aTeleported to the spawn."
  success-back: "{prefix} &aYou went back."
  charged: "{prefix} &f{cost} &7has been charged."
time:
  hours: "{hours}h {minutes}m"
  minutes: "{minutes}m {seconds}s"
  seconds: "{seconds}s"
import:
  usage: "{prefix} &cUse &f/dyhomes import <essentials|huskhomes>&c."
  husk-not-found: "{prefix} &cNo plugins/HuskHomes folder with a database was found."
  husk-database: "{prefix} &cHuskHomes uses a &f{type}&c database. Only its default SQLite database can be imported."
  not-found: "{prefix} &cNo plugins/Essentials folder was found."
  running: "{prefix} &cAn import is already running."
  started: "{prefix} &7Reading EssentialsX data..."
  done: "{prefix} &aImport finished: &f{homes} &ahomes, &f{warps} &awarps, spawn: &f{spawn}&a. &7Already in DyHomes and kept: &f{kept}&7. Skipped: &f{skipped}&7."
  failed: "{prefix} &cThe import stopped with an error; check the console. Nothing already in DyHomes was changed."
back:
  disabled: "{prefix} &c/back is turned off on this server."
  none: "{prefix} &cThere is nowhere to go back to yet."
public:
  disabled: "{prefix} &cPublic homes are turned off on this server."
  usage: "{prefix} &cUse &f/publichome <name>&c."
  limit: "{prefix} &cYou can have at most &f{limit}&c public homes."
  opened: "{prefix} &aHome &f{name} &ais now public. Others can visit it with &f/phome&a."
  closed: "{prefix} &aHome &f{name} &ais private again."
  not-found: "{prefix} &cNo public home matches &f{name}&c."
  choose: "{prefix} &7Several public homes match &f{name}&7; choose one:"
  list: "{prefix} &7Public homes &8({count})&7:"
  none: "{prefix} &7There are no public homes yet."
map:
  layer: "Warps"
  warp: "Warp: {name}"
  home: "{player}'s home: {name}"
updates:
  available: "{prefix} &aA new DyHomes version is available: &f{latest} &7(current: &f{current}&7) &e{url}"
