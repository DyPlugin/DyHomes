language-name: Deutsch
value:
  language-auto: "Automatisch"
  language-en: "Englisch"
  language-tr: "Türkisch"
  language-de: "Deutsch"
  language-es: "Spanisch"
  language-ru: "Russisch"
  "yes": "ja"
  "no": "nein"
words:
  force: "force"
# Befehlsnamen in anklickbaren Listen und Hinweisen. Namen oder Aliasse aus plugin.yml verwenden.
commands:
  home: "/home"
  warp: "/warp"
  spawn: "/spawn"
general:
  no-permission: "{prefix} &cDazu hast du keine Berechtigung."
  player-only: "{prefix} &cDieser Befehl kann nur im Spiel verwendet werden."
  unknown-command: "{prefix} &cUnbekannter Befehl. Nutze &f/dyhomes help&c."
  invalid-language: "{prefix} &cVerfügbare Sprachen: &fauto&7, &fen&7, &ftr&7, &fde&7, &fes&7, &fru&c."
  language-changed: "{prefix} &aDeine Sprache ist jetzt &f{language}&a."
  server-language-changed: "{prefix} &aDer Sprachmodus des Servers ist jetzt &f{language}&a."
  player-not-found: "{prefix} &cKein Spieler namens &f{player}&c ist bekannt."
  reload: "{prefix} &aEinstellungen, Nachrichten, Warps und Spawn neu geladen."
  reload-failed: "{prefix} &cNeuladen fehlgeschlagen. Die bisherigen Einstellungen bleiben; siehe Konsole."
help:
  player:
    - "&8&m----------&r &6DyHomes &fHilfe &8&m----------"
    - "&6/home [Name] &7- Zu einem Zuhause teleportieren"
    - "&6/homes &7- Deine Zuhause auflisten"
    - "&6/sethome [Name] &7- Ein Zuhause hier setzen"
    - "&6/delhome <Name> &7- Ein Zuhause löschen"
    - "&6/warp [Name] &7- Zu einem Warp teleportieren oder Warps auflisten"
    - "&6/spawn &7- Zum Spawn teleportieren"
    - "&6/dyhomes language <auto|en|tr|de|es|ru> &7- Sprache ändern"
  admin:
    - "&8&m----------&r &6DyHomes &fAdmin &8&m----------"
    - "&6/setwarp <Name> &7- Einen Warp erstellen oder verschieben"
    - "&6/delwarp <Name> &7- Einen Warp löschen"
    - "&6/setspawn &7- Den Spawn hier setzen"
    - "&6/homes <Spieler> &7- Die Zuhause eines Spielers auflisten"
    - "&6/home <Spieler>:<Name> &7- Das Zuhause eines Spielers besuchen"
    - "&6/delhome <Spieler>:<Name> &7- Das Zuhause eines Spielers löschen"
    - "&6/dyhomes import essentials &7- Zuhause, Warps und Spawn aus EssentialsX übernehmen"
    - "&6/dyhomes reload &7- Einstellungen und Nachrichten neu laden"
list:
  names: "&7{names}"
  name: "&f{name}"
  separator: "&7, "
  hover: "&7Klicken: &f{command}"
homes:
  none: "{prefix} &7Du hast noch kein Zuhause. Setze eins mit &f/sethome&7."
  none-other: "{prefix} &f{player} &7hat kein Zuhause."
  not-found: "{prefix} &cKein Zuhause namens &f{name}&c."
  list: "{prefix} &7Deine Zuhause &8({count}/{limit})&7:"
  list-other: "{prefix} &7Zuhause von &f{player} &8({count})&7:"
  invalid-name: "{prefix} &f{name} &cist kein gültiger Name. Erlaubt sind Buchstaben, Ziffern, '_' und '-', bis zu 32 Zeichen."
  world-disabled: "{prefix} &cIn dieser Welt können keine Zuhause gesetzt werden."
  storage-locked: "{prefix} &cDiese Zuhause können gerade nicht geändert werden. Ein Hinweis steht in der Konsole."
  limit: "{prefix} &cDu hast dein Limit von &f{limit}&c Zuhause erreicht. Lösche eins mit &f/delhome&c oder verschiebe ein vorhandenes."
  claim-denied: "{prefix} &cIn diesem Claim kannst du kein Zuhause setzen. Bitte den Besitzer, dir zu vertrauen."
  save-failed: "{prefix} &cDas konnte nicht gespeichert werden. Nichts wurde geändert; siehe Konsole."
  set: "{prefix} &aZuhause &f{name} &agesetzt &8({count}/{limit})&a."
  moved: "{prefix} &aZuhause &f{name} &ahierher verschoben."
  delete-usage: "{prefix} &cNutze &f/delhome <Name>&c."
  deleted: "{prefix} &aZuhause &f{name} &agelöscht."
  unlimited: "unbegrenzt"
warps:
  none: "{prefix} &7Es gibt noch keine Warps."
  not-found: "{prefix} &cKein Warp namens &f{name}&c."
  list: "{prefix} &7Warps &8({count})&7:"
  set-usage: "{prefix} &cNutze &f/setwarp <Name>&c."
  set: "{prefix} &aWarp &f{name} &aerstellt."
  moved: "{prefix} &aWarp &f{name} &ahierher verschoben."
  delete-usage: "{prefix} &cNutze &f/delwarp <Name>&c."
  deleted: "{prefix} &aWarp &f{name} &agelöscht."
spawn:
  not-set: "{prefix} &cEs wurde kein Spawn gesetzt."
  set: "{prefix} &aSpawn in &f{world} &abei &f{x}, {y}, {z} &agesetzt."
teleport:
  world-missing: "{prefix} &cDie Welt dieses Ziels ist nicht geladen."
  cooldown: "{prefix} &cDu kannst das in &f{time}&c wieder nutzen."
  not-enough-money: "{prefix} &cDafür brauchst du &f{cost}&c."
  claim-denied: "{prefix} &cDu hast keinen Zugang mehr zum Claim, in dem &f{name} &cliegt."
  claim-unavailable: "{prefix} &cDer Claim-Schutz konnte nicht geprüft werden. Versuche es später erneut."
  failed: "{prefix} &cDer Teleport ist fehlgeschlagen. Bitte versuche es erneut."
  unsafe-suffocation: "{prefix} &cDas Ziel ist versperrt; du würdest in einer Wand stecken."
  unsafe-hazard: "{prefix} &cAm Ziel ist Lava, Feuer oder eine andere Gefahr."
  unsafe-fall: "{prefix} &cUnter dem Ziel ist kein Boden."
  unsafe-void: "{prefix} &cDas Ziel liegt außerhalb der Welthöhe."
  unsafe-hint: "{prefix} &7Um trotzdem hinzugehen, nutze &f{command}&7."
  warmup: "{prefix} &7Teleport in &f{seconds}&7 Sekunden. Nicht bewegen."
  cancel-move: "{prefix} &cTeleport abgebrochen, weil du dich bewegt hast."
  cancel-damage: "{prefix} &cTeleport abgebrochen, weil du Schaden genommen hast."
  success-home: "{prefix} &aWillkommen zu Hause in &f{name}&a."
  success-warp: "{prefix} &aZum Warp &f{name} &ateleportiert."
  success-spawn: "{prefix} &aZum Spawn teleportiert."
  charged: "{prefix} &f{cost} &7wurden abgebucht."
time:
  hours: "{hours} Std. {minutes} Min."
  minutes: "{minutes} Min. {seconds} Sek."
  seconds: "{seconds} Sek."
import:
  usage: "{prefix} &cNutze &f/dyhomes import essentials&c."
  not-found: "{prefix} &cKein Ordner plugins/Essentials gefunden."
  running: "{prefix} &cEin Import läuft bereits."
  started: "{prefix} &7EssentialsX-Daten werden gelesen..."
  done: "{prefix} &aImport fertig: &f{homes} &aZuhause, &f{warps} &aWarps, Spawn: &f{spawn}&a. &7Bereits in DyHomes und behalten: &f{kept}&7. Übersprungen: &f{skipped}&7."
  failed: "{prefix} &cDer Import wurde mit einem Fehler beendet; siehe Konsole. Nichts, was schon in DyHomes war, wurde geändert."
updates:
  available: "{prefix} &aEine neue DyHomes-Version ist verfügbar: &f{latest} &7(aktuell: &f{current}&7) &e{url}"
