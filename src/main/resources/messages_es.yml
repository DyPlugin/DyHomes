language-name: Español
value:
  language-auto: "Automático"
  language-en: "Inglés"
  language-tr: "Turco"
  language-de: "Alemán"
  language-es: "Español"
  language-ru: "Ruso"
  "yes": "sí"
  "no": "no"
words:
  force: "force"
# Nombres de comandos en listas clicables y avisos. Usa nombres o alias de plugin.yml.
commands:
  home: "/home"
  warp: "/warp"
  spawn: "/spawn"
general:
  no-permission: "{prefix} &cNo tienes permiso para hacer eso."
  player-only: "{prefix} &cEste comando solo se puede usar dentro del juego."
  unknown-command: "{prefix} &cComando desconocido. Usa &f/dyhomes help&c."
  invalid-language: "{prefix} &cIdiomas disponibles: &fauto&7, &fen&7, &ftr&7, &fde&7, &fes&7, &fru&c."
  language-changed: "{prefix} &aTu idioma ahora es &f{language}&a."
  server-language-changed: "{prefix} &aEl modo de idioma del servidor ahora es &f{language}&a."
  player-not-found: "{prefix} &cNo se conoce a ningún jugador llamado &f{player}&c."
  reload: "{prefix} &aAjustes, mensajes, warps y spawn recargados."
  reload-failed: "{prefix} &cNo se pudo recargar. Se mantienen los ajustes anteriores; revisa la consola."
help:
  player:
    - "&8&m----------&r &6DyHomes &fAyuda &8&m----------"
    - "&6/home [nombre] &7- Teletransportarte a una casa"
    - "&6/homes &7- Ver tus casas"
    - "&6/sethome [nombre] &7- Fijar una casa donde estás"
    - "&6/delhome <nombre> &7- Borrar una casa"
    - "&6/warp [nombre] &7- Ir a un warp o ver la lista"
    - "&6/spawn &7- Teletransportarte al spawn"
    - "&6/dyhomes language <auto|en|tr|de|es|ru> &7- Cambiar tu idioma"
  admin:
    - "&8&m----------&r &6DyHomes &fAdmin &8&m----------"
    - "&6/setwarp <nombre> &7- Crear o mover un warp"
    - "&6/delwarp <nombre> &7- Borrar un warp"
    - "&6/setspawn &7- Fijar el spawn donde estás"
    - "&6/homes <jugador> &7- Ver las casas de un jugador"
    - "&6/home <jugador>:<nombre> &7- Visitar la casa de un jugador"
    - "&6/delhome <jugador>:<nombre> &7- Borrar la casa de un jugador"
    - "&6/dyhomes import essentials &7- Copiar casas, warps y spawn de EssentialsX"
    - "&6/dyhomes reload &7- Recargar ajustes y mensajes"
list:
  names: "&7{names}"
  name: "&f{name}"
  separator: "&7, "
  hover: "&7Clic: &f{command}"
homes:
  none: "{prefix} &7Aún no tienes casas. Usa &f/sethome &7para fijar una."
  none-other: "{prefix} &f{player} &7no tiene casas."
  not-found: "{prefix} &cNo hay ninguna casa llamada &f{name}&c."
  list: "{prefix} &7Tus casas &8({count}/{limit})&7:"
  list-other: "{prefix} &7Casas de &f{player} &8({count})&7:"
  invalid-name: "{prefix} &f{name} &cno es un nombre válido. Usa letras, números, '_' o '-', hasta 32 caracteres."
  world-disabled: "{prefix} &cNo se pueden fijar casas en este mundo."
  storage-locked: "{prefix} &cAhora no se pueden cambiar estas casas. Hay un aviso en la consola."
  limit: "{prefix} &cHas llegado a tu límite de &f{limit}&c casas. Borra una con &f/delhome&c o mueve una existente."
  claim-denied: "{prefix} &cNo puedes fijar una casa en este claim. Pide a su dueño que confíe en ti."
  save-failed: "{prefix} &cNo se pudo guardar. No se cambió nada; revisa la consola."
  set: "{prefix} &aCasa &f{name} &afijada &8({count}/{limit})&a."
  moved: "{prefix} &aCasa &f{name} &amovida aquí."
  delete-usage: "{prefix} &cUsa &f/delhome <nombre>&c."
  deleted: "{prefix} &aCasa &f{name} &aborrada."
  unlimited: "sin límite"
warps:
  none: "{prefix} &7Aún no hay warps."
  not-found: "{prefix} &cNo hay ningún warp llamado &f{name}&c."
  list: "{prefix} &7Warps &8({count})&7:"
  set-usage: "{prefix} &cUsa &f/setwarp <nombre>&c."
  set: "{prefix} &aWarp &f{name} &acreado."
  moved: "{prefix} &aWarp &f{name} &amovido aquí."
  delete-usage: "{prefix} &cUsa &f/delwarp <nombre>&c."
  deleted: "{prefix} &aWarp &f{name} &aborrado."
spawn:
  not-set: "{prefix} &cNo se ha fijado ningún spawn."
  set: "{prefix} &aSpawn fijado en &f{world} &aen &f{x}, {y}, {z}&a."
teleport:
  world-missing: "{prefix} &cEl mundo de este destino no está cargado."
  cooldown: "{prefix} &cPodrás usarlo de nuevo en &f{time}&c."
  not-enough-money: "{prefix} &cNecesitas &f{cost}&c para esto."
  claim-denied: "{prefix} &cYa no tienes acceso al claim donde está &f{name}&c."
  claim-unavailable: "{prefix} &cNo se pudo comprobar la protección del claim. Inténtalo más tarde."
  failed: "{prefix} &cEl teletransporte falló. Inténtalo de nuevo."
  unsafe-suffocation: "{prefix} &cEl destino está bloqueado; quedarías dentro de una pared."
  unsafe-hazard: "{prefix} &cEn el destino hay lava, fuego u otro peligro."
  unsafe-fall: "{prefix} &cNo hay suelo bajo el destino."
  unsafe-void: "{prefix} &cEl destino está fuera de la altura del mundo."
  unsafe-hint: "{prefix} &7Para ir de todos modos, usa &f{command}&7."
  warmup: "{prefix} &7Teletransporte en &f{seconds}&7 segundos. No te muevas."
  cancel-move: "{prefix} &cTeletransporte cancelado porque te moviste."
  cancel-damage: "{prefix} &cTeletransporte cancelado porque recibiste daño."
  success-home: "{prefix} &aBienvenido a casa, &f{name}&a."
  success-warp: "{prefix} &aTeletransportado al warp &f{name}&a."
  success-spawn: "{prefix} &aTeletransportado al spawn."
  charged: "{prefix} &7Se han cobrado &f{cost}&7."
time:
  hours: "{hours} h {minutes} min"
  minutes: "{minutes} min {seconds} s"
  seconds: "{seconds} s"
import:
  usage: "{prefix} &cUsa &f/dyhomes import essentials&c."
  not-found: "{prefix} &cNo se encontró la carpeta plugins/Essentials."
  running: "{prefix} &cYa hay una importación en curso."
  started: "{prefix} &7Leyendo los datos de EssentialsX..."
  done: "{prefix} &aImportación terminada: &f{homes} &acasas, &f{warps} &awarps, spawn: &f{spawn}&a. &7Ya estaban en DyHomes y se conservan: &f{kept}&7. Omitidos: &f{skipped}&7."
  failed: "{prefix} &cLa importación se detuvo con un error; revisa la consola. No se cambió nada que ya estuviera en DyHomes."
updates:
  available: "{prefix} &aHay una nueva versión de DyHomes: &f{latest} &7(actual: &f{current}&7) &e{url}"
