language-name: Русский
value:
  language-auto: "Автоматически"
  language-en: "Английский"
  language-tr: "Турецкий"
  language-de: "Немецкий"
  language-es: "Испанский"
  language-ru: "Русский"
  "yes": "да"
  "no": "нет"
words:
  force: "force"
# Названия команд в кликабельных списках и подсказках. Используйте имена или псевдонимы из plugin.yml.
commands:
  home: "/home"
  warp: "/warp"
  spawn: "/spawn"
  back: "/back"
  phome: "/phome"
general:
  no-permission: "{prefix} &cУ вас нет прав на это."
  player-only: "{prefix} &cЭту команду можно использовать только в игре."
  unknown-command: "{prefix} &cНеизвестная команда. Используйте &f/dyhomes help&c."
  invalid-language: "{prefix} &cДоступные языки: &fauto&7, &fen&7, &ftr&7, &fde&7, &fes&7, &fru&c."
  language-changed: "{prefix} &aВаш язык теперь &f{language}&a."
  server-language-changed: "{prefix} &aЯзыковой режим сервера теперь &f{language}&a."
  player-not-found: "{prefix} &cИгрок &f{player}&c не известен."
  reload: "{prefix} &aНастройки, сообщения, варпы и спавн перезагружены."
  reload-failed: "{prefix} &cНе удалось перезагрузить. Прежние настройки сохранены; проверьте консоль."
help:
  player:
    - "&8&m----------&r &6DyHomes &fПомощь &8&m----------"
    - "&6/home [имя] &7- Телепорт домой"
    - "&6/homes &7- Список ваших домов"
    - "&6/sethome [имя] &7- Установить дом здесь"
    - "&6/delhome <имя> &7- Удалить дом"
    - "&6/warp [имя] &7- Телепорт на варп или список варпов"
    - "&6/spawn &7- Телепорт на спавн"
    - "&6/back &7- Вернуться туда, откуда вы последний раз телепортировались или где умерли"
    - "&6/publichome <имя> &7- Открыть дом для всех или закрыть его"
    - "&6/phome <игрок:дом> &7- Посетить открытый дом"
    - "&6/phomes &7- Список открытых домов"
    - "&6/dyhomes language <auto|en|tr|de|es|ru> &7- Сменить язык"
  admin:
    - "&8&m----------&r &6DyHomes &fАдмин &8&m----------"
    - "&6/setwarp <имя> &7- Создать или переместить варп"
    - "&6/delwarp <имя> &7- Удалить варп"
    - "&6/setspawn &7- Установить спавн здесь"
    - "&6/homes <игрок> &7- Список домов игрока"
    - "&6/home <игрок>:<имя> &7- Посетить дом игрока"
    - "&6/delhome <игрок>:<имя> &7- Удалить дом игрока"
    - "&6/dyhomes import <essentials|huskhomes> &7- Перенести дома, варпы и спавн из EssentialsX или HuskHomes"
    - "&6/dyhomes reload &7- Перезагрузить настройки и сообщения"
list:
  names: "&7{names}"
  name: "&f{name}"
  name-public: "&a{name}"
  separator: "&7, "
  hover: "&7Нажмите: &f{command}"
homes:
  none: "{prefix} &7У вас пока нет домов. Установите дом командой &f/sethome&7."
  none-other: "{prefix} &7У игрока &f{player} &7нет домов."
  not-found: "{prefix} &cДома с именем &f{name}&c нет."
  list: "{prefix} &7Ваши дома &8({count}/{limit})&7:"
  list-other: "{prefix} &7Дома игрока &f{player} &8({count})&7:"
  invalid-name: "{prefix} &f{name} &c— недопустимое имя. Используйте буквы, цифры, '_' или '-', до 32 символов."
  world-disabled: "{prefix} &cВ этом мире нельзя устанавливать дома."
  storage-locked: "{prefix} &cЭти дома сейчас нельзя изменить. Сообщение есть в консоли."
  limit: "{prefix} &cВы достигли лимита домов: &f{limit}&c. Удалите дом через &f/delhome&c или переместите существующий."
  claim-denied: "{prefix} &cВ этом привате нельзя установить дом. Попросите владельца добавить вас в доверенные."
  save-failed: "{prefix} &cНе удалось сохранить. Ничего не изменено; проверьте консоль."
  set: "{prefix} &aДом &f{name} &aустановлен &8({count}/{limit})&a."
  moved: "{prefix} &aДом &f{name} &aперемещён сюда."
  delete-usage: "{prefix} &cИспользуйте &f/delhome <имя>&c."
  deleted: "{prefix} &aДом &f{name} &aудалён."
  unlimited: "без лимита"
warps:
  none: "{prefix} &7Варпов пока нет."
  not-found: "{prefix} &cВарпа с именем &f{name}&c нет."
  list: "{prefix} &7Варпы &8({count})&7:"
  set-usage: "{prefix} &cИспользуйте &f/setwarp <имя>&c."
  set: "{prefix} &aВарп &f{name} &aсоздан."
  moved: "{prefix} &aВарп &f{name} &aперемещён сюда."
  delete-usage: "{prefix} &cИспользуйте &f/delwarp <имя>&c."
  deleted: "{prefix} &aВарп &f{name} &aудалён."
spawn:
  not-set: "{prefix} &cСпавн не установлен."
  set: "{prefix} &aСпавн установлен в мире &f{world} &aна &f{x}, {y}, {z}&a."
teleport:
  world-missing: "{prefix} &cМир этой точки не загружен."
  cooldown: "{prefix} &cСнова использовать можно через &f{time}&c."
  not-enough-money: "{prefix} &cДля этого нужно &f{cost}&c."
  claim-denied: "{prefix} &cУ вас больше нет доступа к привату, где находится &f{name}&c."
  claim-unavailable: "{prefix} &cНе удалось проверить защиту привата. Попробуйте позже."
  failed: "{prefix} &cТелепорт не удался. Попробуйте ещё раз."
  unsafe-suffocation: "{prefix} &cТочка закрыта; вы застрянете в стене."
  unsafe-hazard: "{prefix} &cВ точке есть лава, огонь или другая опасность."
  unsafe-fall: "{prefix} &cПод точкой нет земли."
  unsafe-void: "{prefix} &cТочка за пределами высоты мира."
  unsafe-hint: "{prefix} &7Чтобы всё равно переместиться, используйте &f{command}&7."
  warmup: "{prefix} &7Телепорт через &f{seconds}&7 сек. Не двигайтесь."
  cancel-move: "{prefix} &cТелепорт отменён, потому что вы сдвинулись."
  cancel-damage: "{prefix} &cТелепорт отменён, потому что вы получили урон."
  success-home: "{prefix} &aДобро пожаловать домой: &f{name}&a."
  success-warp: "{prefix} &aВы телепортировались на варп &f{name}&a."
  success-spawn: "{prefix} &aВы телепортировались на спавн."
  success-back: "{prefix} &aВы вернулись."
  charged: "{prefix} &7Списано &f{cost}&7."
time:
  hours: "{hours} ч {minutes} мин"
  minutes: "{minutes} мин {seconds} сек"
  seconds: "{seconds} сек"
import:
  usage: "{prefix} &cИспользуйте &f/dyhomes import <essentials|huskhomes>&c."
  husk-not-found: "{prefix} &cПапка plugins/HuskHomes с базой данных не найдена."
  husk-database: "{prefix} &cHuskHomes использует базу данных &f{type}&c. Можно перенести только стандартную базу SQLite."
  not-found: "{prefix} &cПапка plugins/Essentials не найдена."
  running: "{prefix} &cИмпорт уже идёт."
  started: "{prefix} &7Чтение данных EssentialsX..."
  done: "{prefix} &aИмпорт завершён: домов &f{homes}&a, варпов &f{warps}&a, спавн: &f{spawn}&a. &7Уже были в DyHomes и сохранены: &f{kept}&7. Пропущено: &f{skipped}&7."
  failed: "{prefix} &cИмпорт остановлен из-за ошибки; проверьте консоль. То, что уже было в DyHomes, не изменено."
back:
  disabled: "{prefix} &c/back отключён на этом сервере."
  none: "{prefix} &cПока некуда возвращаться."
public:
  disabled: "{prefix} &cОткрытые дома отключены на этом сервере."
  usage: "{prefix} &cИспользуйте &f/publichome <имя>&c."
  limit: "{prefix} &cМожно открыть не больше &f{limit}&c домов."
  opened: "{prefix} &aДом &f{name} &aтеперь открыт. Другие могут посетить его через &f/phome&a."
  closed: "{prefix} &aДом &f{name} &aснова закрыт."
  not-found: "{prefix} &cНет открытого дома, подходящего под &f{name}&c."
  choose: "{prefix} &7Под &f{name}&7 подходят несколько открытых домов; выберите один:"
  list: "{prefix} &7Открытые дома &8({count})&7:"
  none: "{prefix} &7Открытых домов пока нет."
map:
  layer: "Варпы"
  warp: "Варп: {name}"
  home: "Дом игрока {player}: {name}"
updates:
  available: "{prefix} &aДоступна новая версия DyHomes: &f{latest} &7(текущая: &f{current}&7) &e{url}"
